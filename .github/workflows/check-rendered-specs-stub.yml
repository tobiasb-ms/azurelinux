# Stub workflow — This workflow must live on the default branch (4.0) and
# trigger on pull_request for PR visibility. Under pull_request, the caller
# workflow definition comes from the PR merge ref, so this entrypoint is
# PR-controlled and not suitable as a trusted merge-integrity gate by itself.
# The reusable workflow on 4.0 still provides the rendering implementation.
name: Check Rendered Specs

# pull_request callers are intentionally read-only. The reusable workflow
# cannot elevate these permissions.
on:
  pull_request:
    branches:
      - "4.0"

permissions: {}

concurrency:
  group: render-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Prevent forks from running a stale/vulnerable copy of this stub with Actions enabled
    if: github.repository == 'microsoft/azurelinux'
    # Intentionally branch-pinned so the reusable workflow picks up updates automatically.
    uses: microsoft/azurelinux/.github/workflows/check-rendered-specs.yml@4.0 # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
      pull-requests: read # pass PR metadata inputs to the reusable workflow
    with:
      pr-head-sha: ${{ github.event.pull_request.head.sha }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name }}
      pr-base-sha: ${{ github.event.pull_request.base.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      repo: ${{ github.repository }}
